# Smart Medicine Platform — Docker Compose
version: "3.9"

services:
  # ---- Node.js Express API (primary backend for frontend) ----
  node-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.node
    container_name: sm-node-api
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - ./backend/server:/app/server
      - ./backend/shared:/app/shared
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/smartmedicine
      PORT: "5000"
      CORS_ORIGIN: http://localhost:3000
      SESSION_SECRET: ${SESSION_SECRET:-medisafe-session-secret-change-me}
    restart: unless-stopped

  # ---- FastAPI Backend (extended API) ----
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sm-api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # ---- Celery Worker ----
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sm-worker
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - api
      - redis
    command: celery -A app.celery_app worker -l info -Q default,reminders,notifications
    restart: unless-stopped

  # ---- Celery Beat ----
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sm-beat
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - worker
    command: celery -A app.celery_app beat -l info
    restart: unless-stopped

  # ---- PostgreSQL ----
  db:
    image: postgis/postgis:15-3.4
    container_name: sm-db
    environment:
      POSTGRES_DB: smartmedicine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: sm-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  # ---- Elasticsearch ----
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    container_name: sm-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped

  # ---- Frontend (Vite React SPA) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sm-frontend
    ports:
      - "3000:3000"
    depends_on:
      - node-api
    restart: unless-stopped

  # ---- Nginx Reverse Proxy ----
  nginx:
    image: nginx:1.27-alpine
    container_name: sm-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node-api
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  esdata:
